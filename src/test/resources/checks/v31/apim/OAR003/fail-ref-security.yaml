openapi: "3.1.0"
info:
  version: 1.0.0
  title: Swagger Petstore
paths:
  /pets: {}

x-wso2-security:
  $ref: "#/x-wso2-definitions/security"
x-wso2-definitions:
  security:
    apim:
      x-wso2-scopes:
        - name: read
          key: read
          roles: ROLE_READ
          description: Allows users to read the catalogue
        - name: write # Noncompliant {{OAR003: WSO2 scope 'description' is recommended}}
          key: write
          roles: ROLE_WRITE
