swagger: "2.0"
info:
  version: 1.0.0
  title: Swagger Petstore
definitions:
  BaseEntity:
    type: object
    properties:
      id: # Noncompliant {{OAR031: Property 'id' is missing an example.}}
        type: integer
  Pet:
    allOf:
      - $ref: '#/definitions/BaseEntity'
    properties:
      name:
        type: string
        example: "Fluffy"
paths:
  /pets:
    get:
      responses:
        200:
          description: Ok
          schema:
            $ref: '#/definitions/Pet'
          examples:
            application/json:
              name: Fluffy
