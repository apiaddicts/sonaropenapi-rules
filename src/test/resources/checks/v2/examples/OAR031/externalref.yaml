swagger: "2.0"
info:
  version: "1.0.0"
  title: Example API
host: api.example.com
basePath: /v1
schemes:
  - https
paths:
  /users:
    get:
      responses:
        200: # Noncompliant {{OAR031: Response must have an example defined}}
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
        400:
          $ref: >- # Noncompliant {{OAR031: Response must have an example defined}}
            http://localhost:18089/OAR031.yaml#/components/responses/server_error_response
  /users/{userId}:
    get:
      parameters:
        - name: userId
          in: path
          required: true
          type: string
      responses:
        200: # Noncompliant {{OAR031: Response must have an example defined}}
          description: A single user
          schema:
            $ref: '#/definitions/User'
definitions:
  User:
    type: object
    properties:
      id:
        type: string
        example: "123"
      name:
        type: string
        example: "John"
  # `Error` is intentionally never referenced by any path: it exercises the
  # orphan-schema exclusion (property-level checks only cover reachable schemas).
  Error:
    type: object
    properties:
      message:
        type: string