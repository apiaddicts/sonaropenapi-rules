swagger: '2.0'
info:
  title: Ejemplo de API
  version: 1.0.0
paths:
  /item:
    get:
      responses:
        200:
          description: OK
          schema:
            type: object
            properties:
              id:
                type: integer
              nombre:
                type: string
            required:
              - id
              - nombre
          examples: # Noncompliant {{OAR108: Schema does not match the provided example}}
            application/json:
              id: "123"
              nombre: "Ejemplo"
  /nulos:
    get:
      responses:
        200:
          description: OK
          schema:
            type: object
            properties:
              id:
                type: integer
              nombre:
                type: string
          examples:
            application/json:
              id:
              nombre: null
  /enteros:
    get:
      responses:
        200:
          description: OK
          schema:
            type: object
            properties:
              total:
                type: number
          examples:
            application/json:
              total: 5
  /sin-type:
    get:
      responses:
        200:
          description: OK
          schema:
            type: object
            properties:
              sinType:
                description: sin type
          examples:
            application/json:
              sinType: "algo"
