swagger: "2.0"
info:
  version: 1.0.0
  title: Swagger Petstore
produces:
  - application/json
  - text/* # Noncompliant {{OAR044: Declared mime type should conform to RFC6838}}
consumes:
  - application/json
  - text/*             # Noncompliant {{OAR044: Declared mime type should conform to RFC6838}}
paths:
  /pets:
    get: # with produces/consumes
      produces:
        - application   # Noncompliant {{OAR044: Declared mime type should conform to RFC6838}}
        - text/plain
      consumes:
        - application   # Noncompliant {{OAR044: Declared mime type should conform to RFC6838}}
        - text/plain
      responses:
        '200':
          description: some operation
    post:
      produces:
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/ld+json
        - text/csv
        - image/png
        - text/plain;charset=utf-8
        - multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxk
      consumes:
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/ld+json
        - application/json; charset=utf-8; boundary=xyz
      responses:
        '200':
          description: some operation