swagger: "2.0"
info:
  version: 1.0.0
  title: Swagger Petstore
paths:
  /invoices:
    get:
      responses:
        200:
          description: A invoice.
          schema:
            type: object
            properties:
              without:
                type: string # Noncompliant {{OAR037: String types require a valid format, or a valid pattern when no format is defined}}
              withPattern:
                type: string
                pattern: '^[A-Z]{3}-[0-9]+$'
              withInvalidPattern:
                type: string # Noncompliant {{OAR037: String types require a valid format, or a valid pattern when no format is defined}}
                pattern: '['
              date:
                type: string
                format: date
              date-time:
                type: string
                format: date-time
              password:
                type: string
                format: password
              byte:
                type: string
                format: byte
              binary:
                type: string
                format: binary
              email:
                type: string
                format: email
              uuid:
                type: string
                format: uuid
              uri:
                type: string
                format: uri
              hostname:
                type: string
                format: hostname
              ipv4:
                type: string
                format: ipv4
              ipv6:
                type: string
                format: ipv6
              hex1:
                type: string
                format: HEX
              hex16:
                type: string
                format: HEX(16)
              other:
                type: string # Noncompliant {{OAR037: String types require a valid format, or a valid pattern when no format is defined}}
                format: YYYY-MM-DD
